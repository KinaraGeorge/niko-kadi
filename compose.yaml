# Runs all of Kadi Night on one machine: your laptop or the VPS.
#
#   SITE_ADDRESS=http://localhost docker compose up -d --build     (try it locally)
#   SITE_ADDRESS=2-25-6-88.sslip.io docker compose up -d --build   (on the VPS, real HTTPS)
#
# Caddy is the only service open to the internet. It gets HTTPS certificates
# automatically and sends /socket.io traffic to the game server, the rest to the site.
services:
  web:
    build: { context: ., target: web }
    restart: unless-stopped

  game:
    build: { context: ., target: game }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, game]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # livekit:  # self-hosted voice chat (WebRTC), next milestone. See docs/ARCHITECTURE.md.
  #   image: livekit/livekit-server:latest
  #   network_mode: host
  #   command: --config /etc/livekit.yaml

volumes:
  caddy_data:
  caddy_config:
